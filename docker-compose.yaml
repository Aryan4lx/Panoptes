services:
  redis:
    image: redis:6
    restart: on-failure
    mem_limit: 256m
    volumes:
    - redis:/data

  mongodb:
    image: mongo:4
    restart: on-failure
    mem_limit: 1g
    volumes:
      - mongodb:/data

  # See https://github.com/hashicorp/consul/blob/master/demo/docker-compose-cluster/docker-compose.yml
  # for a production-ready config.
  consul:
    image: consul:1.8
    restart: on-failure
    mem_limit: 256m
    command: consul agent -dev -log-level=info -client=0.0.0.0

  ui:
    image: panoptes-ui:local
    # optional: the web dashboard - engines + API run without it, and hosts
    # that cannot build the node image still get a working scanner
    profiles: ["ui"]
    restart: on-failure
    mem_limit: 512m
    ports:
      - "8888:8888"
    depends_on:
      - api
    environment:
      - "API_URL=http://api:5000"
      - "NUXT_HOST=0.0.0.0"
      - "NUXT_PORT=8888"
    build:
      context: MalwareMultiScan.Ui
      dockerfile: Dockerfile

  api:
    image: panoptes-api:local
    restart: on-failure
    mem_limit: 512m
    depends_on:
      - consul
      - redis
      - mongodb
    environment:
      - "REDIS_ADDRESS=redis:6379"
      - "CONSUL_ADDRESS=http://consul:8500"
      - "MONGO_ADDRESS=mongodb://mongodb:27017?connectTimeoutMS=120000"
    build:
      context: .
      dockerfile: MalwareMultiScan.Api/Dockerfile
      additional_contexts:
        # offline restore: PANOPTES_NUGET_CACHE=<extracted cache dir>; default
        # placeholder dir restores from nuget.org
        nuget-cache: ${PANOPTES_NUGET_CACHE:-./MalwareMultiScan.Api/nuget-cache-placeholder}

  # helper used by scripts/e2e-core.sh to generate + post the sample
  # inside the compose network (never on the host filesystem)
  curl:
    image: curlimages/curl:8.10.1
    profiles: ["e2e"]
    entrypoint: ["sh"]
    mem_limit: 64m

  dummy-scanner:
    image: panoptes-scanner:local
    restart: on-failure
    mem_limit: 512m
    depends_on:
      - consul
      - redis
    environment:
      - "REDIS_ADDRESS=redis:6379"
      - "CONSUL_ADDRESS=http://consul:8500"
      - "WORKER_COUNT=2"
      - "MAX_SCANNING_TIME=900"
    build:
      context: .
      dockerfile: MalwareMultiScan.Scanner/Dockerfile

  clamav-scanner:
    image: panoptes-scanner-clamav:local
    restart: on-failure
    mem_limit: 1g
    profiles: ["clamav"]
    depends_on:
      - dummy-scanner
    environment:
      - "REDIS_ADDRESS=redis:6379"
      - "CONSUL_ADDRESS=http://consul:8500"
      - "WORKER_COUNT=2"
      - "MAX_SCANNING_TIME=900"
    build:
      context: MalwareMultiScan.Backends/Dockerfiles
      dockerfile: Clamav.Dockerfile
      args:
        - "HTTP_PROXY=${PANOPTES_BUILD_PROXY:-}"
        - "DEBIAN_MIRROR=${PANOPTES_DEBIAN_MIRROR:-https://deb.debian.org}"
        - "DEBIAN_SECURITY_MIRROR=${PANOPTES_DEBIAN_SECURITY_MIRROR:-https://deb.debian.org}"

  windows-defender-scanner:
    image: panoptes-scanner-windows-defender:local
    restart: on-failure
    mem_limit: 1g
    profiles: ["windows-defender"]
    depends_on:
      - dummy-scanner
    environment:
      - "REDIS_ADDRESS=redis:6379"
      - "CONSUL_ADDRESS=http://consul:8500"
      - "WORKER_COUNT=2"
      - "MAX_SCANNING_TIME=900"
    build:
      context: MalwareMultiScan.Backends/Dockerfiles
      dockerfile: WindowsDefender.Dockerfile
      args:
        - "HTTP_PROXY=${PANOPTES_BUILD_PROXY:-}"
        - "DEBIAN_MIRROR=${PANOPTES_DEBIAN_MIRROR:-https://deb.debian.org}"
        - "DEBIAN_SECURITY_MIRROR=${PANOPTES_DEBIAN_SECURITY_MIRROR:-https://deb.debian.org}"

  # IMPORTANT: FOLLOWING SCAN BACKENDS SHOULD BE ENABLED ONLY IF YOU HAVE A VALID LICENSE
  # IMPORTANT: PLEASE CHECK VENDORS EULA TO STAY COMPLIANT WITH USAGE POLICY

  drweb-scanner:
    image: panoptes-scanner-drweb:local
    restart: on-failure
    mem_limit: 1g
    profiles: ["drweb"]
    volumes:
      # Demo-key requests are vendor-throttled; the entrypoint persists the
      # fetched key in this volume and restores it on every start, so container
      # recreation does not need a new demo request. To force a refresh:
      #   docker compose --profile drweb down && docker volume rm panoptes_drweb-license
      - drweb-license:/var/lib/panoptes-drweb
    depends_on:
      - dummy-scanner
    environment:
      - "REDIS_ADDRESS=redis:6379"
      - "CONSUL_ADDRESS=http://consul:8500"
      - "WORKER_COUNT=2"
      - "MAX_SCANNING_TIME=900"
    build:
      context: MalwareMultiScan.Backends/Dockerfiles
      dockerfile: DrWeb.Dockerfile
      args:
        - "HTTP_PROXY=${PANOPTES_BUILD_PROXY:-}"
        - "DEBIAN_MIRROR=${PANOPTES_DEBIAN_MIRROR:-https://deb.debian.org}"
        - "DEBIAN_SECURITY_MIRROR=${PANOPTES_DEBIAN_SECURITY_MIRROR:-https://deb.debian.org}"

  kes-scanner:
    image: panoptes-scanner-kes:local
    restart: on-failure
    mem_limit: 2g
    profiles: ["kes"]
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - DAC_READ_SEARCH
    security_opt:
      - seccomp=unconfined
    depends_on:
      - dummy-scanner
    environment:
      - "REDIS_ADDRESS=redis:6379"
      - "CONSUL_ADDRESS=http://consul:8500"
      - "WORKER_COUNT=2"
      - "MAX_SCANNING_TIME=900"
    build:
      context: MalwareMultiScan.Backends/Dockerfiles
      dockerfile: KES.Dockerfile
      args:
        - "DEBIAN_MIRROR=${PANOPTES_DEBIAN_MIRROR:-https://deb.debian.org}"
        - "DEBIAN_SECURITY_MIRROR=${PANOPTES_DEBIAN_SECURITY_MIRROR:-https://deb.debian.org}"

  escan-scanner:
    image: panoptes-escanner:local
    restart: on-failure
    mem_limit: 1g
    profiles: ["escan"]
    depends_on:
      - dummy-scanner
    environment:
      - "REDIS_ADDRESS=redis:6379"
      - "CONSUL_ADDRESS=http://consul:8500"
      - "WORKER_COUNT=2"
      - "MAX_SCANNING_TIME=900"
    build:
      context: MalwareMultiScan.Backends/Dockerfiles
      dockerfile: EScan.Dockerfile
      args:
        - "DEBIAN_MIRROR=${PANOPTES_DEBIAN_MIRROR:-https://deb.debian.org}"
        - "DEBIAN_SECURITY_MIRROR=${PANOPTES_DEBIAN_SECURITY_MIRROR:-https://deb.debian.org}"

  comodo-scanner:
    image: panoptes-scanner-comodo:local
    restart: on-failure
    mem_limit: 1g
    profiles: ["comodo"]
    depends_on:
      - dummy-scanner
    environment:
      - "REDIS_ADDRESS=redis:6379"
      - "CONSUL_ADDRESS=http://consul:8500"
      - "WORKER_COUNT=2"
      - "MAX_SCANNING_TIME=900"
    build:
      context: MalwareMultiScan.Backends/Dockerfiles
      dockerfile: Comodo.Dockerfile
      args:
        - "HTTP_PROXY=${PANOPTES_BUILD_PROXY:-}"
        - "DEBIAN_MIRROR=${PANOPTES_DEBIAN_MIRROR:-https://deb.debian.org}"
        - "DEBIAN_SECURITY_MIRROR=${PANOPTES_DEBIAN_SECURITY_MIRROR:-https://deb.debian.org}"

  eset-scanner:
    image: panoptes-scanner-eset:local
    restart: on-failure
    mem_limit: 1g
    profiles: ["eset"]
    depends_on:
      - dummy-scanner
    environment:
      - "REDIS_ADDRESS=redis:6379"
      - "CONSUL_ADDRESS=http://consul:8500"
      - "WORKER_COUNT=2"
      - "MAX_SCANNING_TIME=900"
      # activation key consumed by eset-entrypoint.sh at runtime (never baked
      # into the image); set PANOPTES_ESET_STRICT=1 to refuse starting
      # unactivated
      - "PANOPTES_ESET_KEY=${PANOPTES_ESET_KEY:-}"
    build:
      context: MalwareMultiScan.Backends/Dockerfiles
      dockerfile: ESET.Dockerfile

  mcafee-scanner:
    image: panoptes-scanner-mcafee:local
    restart: on-failure
    mem_limit: 512m
    profiles: ["mcafee"]
    depends_on:
      - dummy-scanner
    environment:
      - "REDIS_ADDRESS=redis:6379"
      - "CONSUL_ADDRESS=http://consul:8500"
      - "WORKER_COUNT=2"
      - "MAX_SCANNING_TIME=900"
    build:
      context: MalwareMultiScan.Backends/Dockerfiles
      dockerfile: McAfee.Dockerfile
      args:
        - "HTTP_PROXY=${PANOPTES_BUILD_PROXY:-}"
        - "DEBIAN_MIRROR=${PANOPTES_DEBIAN_MIRROR:-https://deb.debian.org}"
        - "DEBIAN_SECURITY_MIRROR=${PANOPTES_DEBIAN_SECURITY_MIRROR:-https://deb.debian.org}"

# eset-scanner and escan-scanner services are added by their engine tasks.

volumes:
  mongodb:
  redis:
  drweb-license:
